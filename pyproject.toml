[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ping-claude"
version = "0.1.0"
description = "Remote control for Claude Code from your phone via Tailscale"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Pranav"}
]
keywords = ["claude", "ai", "remote", "mobile", "tailscale", "hooks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "websockets>=12.0",
    "qrcode[pil]>=7.4.2",
]

[project.scripts]
ping-claude = "laptop.cli:main"

[tool.setuptools.packages.find]
include = ["laptop*"]
