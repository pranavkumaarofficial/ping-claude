[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ping-claude"
version = "1.0.0"
description = "Control Claude Code from your phone via Telegram — notifications, approvals, voice commands, and real-time activity feed"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Pranav Kumaar"}
]
keywords = ["claude", "claude-code", "telegram", "remote-control", "hooks", "ai", "voice", "notifications"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "websockets>=12.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0", "aiohttp>=3.9"]
webapp = ["aiohttp>=3.9"]
all = ["python-telegram-bot>=21.0", "aiohttp>=3.9"]

[project.scripts]
ping-claude = "laptop.cli:main"

[tool.setuptools.packages.find]
include = ["laptop*"]

[tool.setuptools.package-data]
"laptop.server" = ["webapp/**/*"]
